<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open batch · Batch Link Opener</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
        <path d="M10 13.5a4 4 0 0 0 5.7.4l2.6-2.6a4 4 0 0 0-5.7-5.7l-1.5 1.5"/>
        <path d="M14 10.5a4 4 0 0 0-5.7-.4l-2.6 2.6a4 4 0 1 0 5.7 5.7l1.5-1.5"/>
      </svg>
      Batch Link Opener
    </a>
    <h1 id="heading">Loading…</h1>
    <p class="lede" id="sub"></p>
  </header>

  <main>
    <section class="card" id="panel" hidden>
      <button type="button" class="primary big" id="openAll">Open all tabs</button>
      <div class="bar"><i id="bar"></i></div>

      <p class="tip" id="tip" hidden>
        Opening several tabs at once needs pop-ups allowed for this site.
      </p>

      <div class="banner" id="banner" hidden>
        <p class="banner-text" id="bannerText"></p>
        <div class="how" id="how">
          <p class="how-lead" id="howLead"></p>
          <ol class="how-steps" id="howSteps"></ol>
          <details id="howOther">
            <summary>Another browser?</summary>
            <dl class="how-other" id="howOtherList"></dl>
          </details>
        </div>
        <button type="button" class="primary" id="retry">I allowed them — open the rest</button>
      </div>

      <div id="stepper" hidden>
        <div class="next">
          <div class="k" id="stepK">Next</div>
          <div class="v" id="stepV"></div>
        </div>
        <button type="button" class="primary big" id="openNext">Open next</button>
      </div>

      <p class="status" id="status"></p>
      <div class="row actions">
        <button type="button" id="oneByOne">Open one by one</button>
        <button type="button" id="reset">Reset to first</button>
        <button type="button" id="copyAll">Copy all links</button>
        <a class="btn" id="edit" href="/">Edit this list</a>
      </div>

      <ul class="list" id="list"></ul>
    </section>

    <section class="card" id="error" hidden>
      <p id="errorText" class="error-text"></p>
      <a class="btn primary" href="/">Build a new batch</a>
    </section>
  </main>

  <footer>Nothing here was sent anywhere — the list travels inside this link.</footer>
</div>

<script type="module" src="/assets/opener.js"></script>
</body>
</html>
